<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="333" viewBox="0 0 1200 333" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Sobre modelo-documentacao-reutilizavel</title>
<desc id="desc">Modelo reutilizável de documentação técnica de software, pensado para o Projeto Integrador do SENAC. A ideia não é documentar cada linha de código, e sim registrar o suficiente para outra equipe entender o sistema, a arquitetura, as regras e como executá-lo.</desc>
<style>
.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace}
text{shape-rendering:auto}
</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#ffffff" opacity=".06"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".22"/></pattern>
<clipPath id="card"><rect width="1200" height="333" rx="10"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="333" fill="#191817"/>
<rect width="1200" height="333" fill="url(#grid)"/>
<rect width="1200" height="40" fill="#262422"/>
<rect y="40" width="1200" height="1" fill="#3a3733"/>
<rect x="20" y="14" width="12" height="12" fill="#e5534b"/>
<rect x="40" y="14" width="12" height="12" fill="#e0a43b"/>
<rect x="60" y="14" width="12" height="12" fill="#5fb85f"/>
<text x="600" y="25" text-anchor="middle" class="mono" font-size="14" fill="#86817a">sobre.md</text>
<rect x="48" y="78" width="10" height="10" fill="#d97757"/>
<text x="70" y="88" class="mono" font-size="18" font-weight="700" fill="#ece9e4">Sobre o projeto</text>
<text x="70" y="122" class="mono" font-size="16" fill="#b7b2aa" xml:space="preserve"><tspan font-weight="700" fill="#ece9e4">Modelo</tspan><tspan font-weight="700" fill="#ece9e4"> reutilizável</tspan> de<tspan font-weight="700" fill="#ece9e4"> documentação</tspan><tspan font-weight="700" fill="#ece9e4"> técnica</tspan> de software, pensado para o<tspan font-weight="700" fill="#ece9e4"> Projeto</tspan><tspan font-weight="700" fill="#ece9e4"> Integrador</tspan> do SENAC. A ideia</text>
<text x="70" y="149" class="mono" font-size="16" fill="#b7b2aa" xml:space="preserve">não é documentar cada linha de código, e sim registrar o suficiente para outra equipe entender o sistema, a</text>
<text x="70" y="176" class="mono" font-size="16" fill="#b7b2aa" xml:space="preserve"><tspan font-weight="700" fill="#ece9e4">arquitetura</tspan>, as<tspan font-weight="700" fill="#ece9e4"> regras</tspan> e como executá-lo.</text>
<rect x="48" y="207" width="1104" height="1" fill="#3a3733"/>
<rect x="72" y="228" width="7" height="7" fill="#d97757"/>
<text x="92" y="237" class="mono" font-size="15" fill="#b7b2aa" xml:space="preserve">Arquivo<tspan font-weight="700" fill="#ece9e4"> .docx</tspan> pronto para preencher</text>
<rect x="72" y="258" width="7" height="7" fill="#d97757"/>
<text x="92" y="267" class="mono" font-size="15" fill="#b7b2aa" xml:space="preserve">18 seções com orientações e exemplos em cada uma</text>
<rect x="72" y="288" width="7" height="7" fill="#d97757"/>
<text x="92" y="297" class="mono" font-size="15" fill="#b7b2aa" xml:space="preserve">Feito para o<tspan font-weight="700" fill="#ece9e4"> Técnico</tspan><tspan font-weight="700" fill="#ece9e4"> em</tspan><tspan font-weight="700" fill="#ece9e4"> Desenvolvimento</tspan><tspan font-weight="700" fill="#ece9e4"> de</tspan><tspan font-weight="700" fill="#ece9e4"> Sistemas</tspan> · SENAC</text>
<rect width="1200" height="333" fill="url(#scan)"/>
</g>
<rect x=".5" y=".5" width="1199" height="332" rx="9.5" fill="none" stroke="#3a3733"/>
</svg>
